<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>নাস্তা ভাই | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 25px auto;
    }

    /* LOGIN */
    #loginBox {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    #loginBox h2 {
      text-align: center;
      margin-top: 0;
      color: #ff6b00;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      background: #ff6b00;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #e85d00;
    }

    #loginMessage {
      color: red;
      text-align: center;
      margin-top: 12px;
    }

    /* ADMIN */
    #adminPanel {
      display: none;
    }

    .topbar {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      margin: 0;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh {
      background: #ff6b00;
      color: white;
    }

    .logout {
      background: #333;
      color: white;
    }

    .orders {
      display: grid;
      gap: 18px;
    }

    .order {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .order-id {
      font-weight: bold;
      color: #ff6b00;
    }

    .customer {
      line-height: 1.8;
    }

    .items {
      background: #fff7f0;
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: #e65100;
    }

    select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 8px;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .order {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍴 নাস্তা ভাই — Admin Panel</h1>
</header>


<!-- =========================
     LOGIN SECTION
========================= -->

<div id="loginBox">

  <h2>🔐 Admin Login</h2>

  <div class="input-group">
    <label>ইমেইল</label>
    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >
  </div>

  <div class="input-group">
    <label>পাসওয়ার্ড</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
    >
  </div>

  <button
    class="login-btn"
    onclick="login()"
  >
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">

  <div class="container">

    <div class="topbar">

      <h2>📋 কাস্টমার অর্ডার</h2>

      <div>

        <button
          class="refresh"
          onclick="loadOrders()"
        >
          🔄 Refresh
        </button>

        <button
          class="logout"
          onclick="logout()"
        >
          🚪 Logout
        </button>

      </div>

    </div>


    <div id="orders" class="orders">

      <div class="empty">
        অর্ডার লোড হচ্ছে...
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE CONFIG
  ========================= */

  const supabaseUrl =
    "https://jsahlgjtqrgzeuvvvtdw.supabase.co";

  const supabaseKey =
    "sb_publishable_kfWQ7IrqJr-WRpBafu8S8Q_qRpT5exw";

  const supabaseClient =
    window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );


  /* =========================
     CHECK LOGIN
  ========================= */

  async function checkLogin() {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();


    if (session) {

      showAdminPanel();

    } else {

      showLogin();

    }

  }


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const message =
      document.getElementById("loginMessage");


    message.innerText = "";


    if (!email || !password) {

      message.innerText =
        "ইমেইল এবং পাসওয়ার্ড দিন।";

      return;

    }


    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


    if (error) {

      console.error(error);

      message.innerText =
        "❌ Login ব্যর্থ হয়েছে। Email অথবা Password সঠিক কিনা দেখুন।";

      return;

    }


    showAdminPanel();

  }


  /* =========================
     SHOW ADMIN PANEL
  ========================= */

  function showAdminPanel() {

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("adminPanel").style.display =
      "block";

    loadOrders();

  }


  /* =========================
     SHOW LOGIN
  ========================= */

  function showLogin() {

    document.getElementById("loginBox").style.display =
      "block";

    document.getElementById("adminPanel").style.display =
      "none";

  }


  /* =========================
     LOAD ORDERS
  ========================= */

  async function loadOrders() {

    const ordersDiv =
      document.getElementById("orders");


    ordersDiv.innerHTML =
      '<div class="empty">অর্ডার লোড হচ্ছে...</div>';


    const {
      data,
      error
    } = await supabaseClient

      .from("orders")

      .select("*")

      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      ordersDiv.innerHTML =
        '<div class="empty">❌ অর্ডার লোড করা যাচ্ছে না।</div>';

      return;

    }


    if (!data || data.length === 0) {

      ordersDiv.innerHTML =
        '<div class="empty">এখনও কোনো অর্ডার নেই।</div>';

      return;

    }


    ordersDiv.innerHTML = "";


    data.forEach(order => {


      let itemsHTML = "";


      if (Array.isArray(order.order_items)) {

        order.order_items.forEach(item => {

          itemsHTML += `

            <div>
              ${item.icon || "🍴"}
${item.name}
× ${item.quantity}
= ৳${item.item_total}
            </div>

          `;

        });

      }


      const date =
        new Date(order.created_at)
        .toLocaleString("bn-BD");


      const orderHTML = `

        <div class="order">

          <div class="order-header">

            <div class="order-id">

              Order #${order.id}

            </div>

            <div>

              ${date}

            </div>

          </div>


          <div class="customer">

            <strong>👤 নাম:</strong>
            ${order.customer_name}

            <br>

            <strong>📱 ফোন:</strong>
${order.customer_phone}

<br>

<a
  href="tel:${order.customer_phone}"
  style="display:inline-block; margin:6px 4px 6px 0; padding:8px 12px; background:#198754; color:white; text-decoration:none; border-radius:6px;"
>
  📞 Call
</a>

<a
  href="https://wa.me/88${order.customer_phone.replace(/^0/, '')}"
  target="_blank"
  style="display:inline-block; margin:6px 0; padding:8px 12px; background:#25D366; color:white; text-decoration:none; border-radius:6px;"
>
  💬 WhatsApp
</a>

<br>

<strong>📍 ঠিকানা:</strong>
${order.customer_address}

          </div>


          <div class="items">

            <strong>🛒 অর্ডার:</strong>

            ${itemsHTML}

          </div>


          <div>

            পণ্যের মূল্য:
            ৳${order.subtotal}

            <br>

            ডেলিভারি:
            ৳${order.delivery_charge}

            <br><br>

            <div class="total">

              মোট:
              ৳${order.total}

            </div>

          </div>


          <div>

            <strong>স্ট্যাটাস:</strong>

            <br>


            <select
              onchange="updateStatus(${order.id}, this.value)"
            >

              <option
                value="New"
                ${order.status === "New" ? "selected" : ""}
              >
                🟢 New
              </option>


             <option
  value="Confirmed"
  ${order.status === "Confirmed" ? "selected" : ""}
>
  🟡 Confirmed
</option>

<option
  value="Preparing"
  ${order.status === "Preparing" ? "selected" : ""}
>
  🟠 Preparing
</option>


              <option
                value="Delivered"
                ${order.status === "Delivered" ? "selected" : ""}
              >
                🔵 Delivered
              </option>


              <option
                value="Cancelled"
                ${order.status === "Cancelled" ? "selected" : ""}
              >
                🔴 Cancelled
              </option>

            </select>

          </div>

        </div>

      `;


      ordersDiv.innerHTML += orderHTML;

    });

  }


  /* =========================
     UPDATE STATUS
  ========================= */

  async function updateStatus(id, status) {

    const {
      error
    } = await supabaseClient

      .from("orders")

      .update({
        status: status
      })

      .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "❌ স্ট্যাটাস পরিবর্তন করা যায়নি।"
      );

      return;

    }


    alert(
      "✅ স্ট্যাটাস পরিবর্তন হয়েছে।"
    );

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    showLogin();

  }


  /* =========================
     START
  ========================= */

  checkLogin();

</script>

</body>
</html>
